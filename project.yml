name: WordClocks
options:
  bundleIdPrefix: com.vicyap
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
packages:
  WordClocksPackage:
    path: .
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.0
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  WordClocksMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/WordClocksMac
    dependencies:
      - package: WordClocksPackage
        product: WordClocks
      - target: WordClocksWidgetsExtension
        embed: true
        codeSign: true
    settings:
      base:
        INFOPLIST_FILE: Apps/WordClocksMac/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.vicyap.WordClocks
        PRODUCT_NAME: WordClocksMac
        CODE_SIGN_ENTITLEMENTS: Apps/WordClocksMac/WordClocksMac.entitlements
  WordClocksWidgetsExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/WordClocksWidgetsExtension
    dependencies:
      - package: WordClocksPackage
        product: WordClocks
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: Apps/WordClocksWidgetsExtension/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.vicyap.WordClocks.widgets
        PRODUCT_NAME: WordClocksWidgetsExtension
        CODE_SIGN_ENTITLEMENTS: Apps/WordClocksWidgetsExtension/WordClocksWidgetsExtension.entitlements
        SKIP_INSTALL: YES
schemes:
  WordClocksMac:
    build:
      targets:
        WordClocksMac: all
    run:
      config: Debug
  WordClocksWidgetsExtension:
    build:
      targets:
        WordClocksWidgetsExtension: all
